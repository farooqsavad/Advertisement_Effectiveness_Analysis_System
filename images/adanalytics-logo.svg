<?xml version="1.0" encoding="UTF-8"?>
<svg width="200px" height="50px" viewBox="0 0 200 50" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
        <linearGradient x1="0%" y1="0%" x2="100%" y2="100%" id="logoGradient">
            <stop stop-color="#4361ee" offset="0%"></stop>
            <stop stop-color="#7209b7" offset="100%"></stop>
        </linearGradient>
    </defs>
    <g stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <!-- Icon -->
        <g transform="translate(5, 5)">
            <circle fill="url(#logoGradient)" cx="20" cy="20" r="20"></circle>
            <path d="M20,10 L30,30 L10,30 Z" fill="white"></path>
            <circle fill="white" cx="20" cy="15" r="3"></circle>
        </g>
        
        <!-- Text -->
        <g transform="translate(50, 30)" fill="url(#logoGradient)" font-family="Arial, sans-serif" font-weight="bold">
            <text font-size="24" letter-spacing="0.5">
                <tspan>Ad</tspan><tspan font-weight="normal">Analytics</tspan>
            </text>
        </g>
    </g>
</svg>