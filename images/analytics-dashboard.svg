<?xml version="1.0" encoding="UTF-8"?>
<svg width="800px" height="500px" viewBox="0 0 800 500" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
        <!-- Gradients -->
        <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4361ee" />
            <stop offset="100%" stop-color="#7209b7" />
        </linearGradient>
        <linearGradient id="secondaryGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#4cc9f0" />
            <stop offset="100%" stop-color="#4361ee" />
        </linearGradient>
        <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#f72585" />
            <stop offset="100%" stop-color="#7209b7" />
        </linearGradient>
        
        <!-- Filters -->
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="5" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        
        <!-- Animations -->
        <style type="text/css">
            @keyframes float {
                0%, 100% { transform: translateY(0); }
                50% { transform: translateY(-10px); }
            }
            
            @keyframes pulse {
                0%, 100% { opacity: 0.8; }
                50% { opacity: 1; }
            }
            
            @keyframes wave {
                0% { transform: translateX(0); }
                100% { transform: translateX(-50%); }
            }
            
            @keyframes grow {
                0%, 100% { transform: scaleY(0.8); }
                50% { transform: scaleY(1); }
            }
            
            .floating {
                animation: float 6s ease-in-out infinite;
            }
            
            .pulsing {
                animation: pulse 4s ease-in-out infinite;
            }
            
            .waving {
                animation: wave 15s linear infinite;
            }
            
            .growing {
                animation: grow 2s ease-in-out infinite;
                transform-origin: bottom;
            }
            
            .delay-1 { animation-delay: 0.2s; }
            .delay-2 { animation-delay: 0.4s; }
            .delay-3 { animation-delay: 0.6s; }
            .delay-4 { animation-delay: 0.8s; }
            .delay-5 { animation-delay: 1.0s; }
        </style>
    </defs>
    
    <!-- Background -->
    <rect width="800" height="500" fill="#f8f9fa" rx="20" />
    
    <!-- Decorative Elements -->
    <g class="waving" opacity="0.05">
        <path d="M0,250 Q200,200 400,250 T800,250 T1200,250 T1600,250" stroke="#4361ee" stroke-width="50" fill="none" />
        <path d="M0,350 Q200,300 400,350 T800,350 T1200,350 T1600,350" stroke="#7209b7" stroke-width="40" fill="none" />
        <path d="M0,150 Q200,100 400,150 T800,150 T1200,150 T1600,150" stroke="#f72585" stroke-width="30" fill="none" />
    </g>
    
    <!-- Main Dashboard Elements -->
    <g class="floating">
        <!-- Dashboard Card -->
        <rect x="100" y="100" width="600" height="300" rx="20" fill="white" filter="url(#glow)" />
        
        <!-- Header -->
        <rect x="120" y="120" width="560" height="60" rx="10" fill="#f8f9fa" />
        <text x="150" y="160" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#212529">Analytics Dashboard</text>
        
        <!-- Chart Area -->
        <rect x="120" y="200" width="340" height="180" rx="10" fill="#f8f9fa" />
        
        <!-- Line Chart -->
        <g transform="translate(140, 360)">
            <line x1="0" y1="0" x2="300" y2="0" stroke="#e9ecef" stroke-width="2" />
            <line x1="0" y1="0" x2="0" y2="-140" stroke="#e9ecef" stroke-width="2" />
            
            <!-- Chart Lines -->
            <path d="M0,-40 C30,-80 60,-60 90,-100 S150,-30 180,-70 S240,-90 300,-50" stroke="url(#primaryGradient)" stroke-width="3" fill="none" />
            <path d="M0,-20 C40,-40 80,-10 120,-30 S180,-60 220,-40 S260,-20 300,-30" stroke="url(#secondaryGradient)" stroke-width="3" fill="none" />
            
            <!-- Data Points -->
            <circle cx="0" cy="-40" r="5" fill="url(#primaryGradient)" class="pulsing" />
            <circle cx="90" cy="-100" r="5" fill="url(#primaryGradient)" class="pulsing delay-1" />
            <circle cx="180" cy="-70" r="5" fill="url(#primaryGradient)" class="pulsing delay-2" />
            <circle cx="300" cy="-50" r="5" fill="url(#primaryGradient)" class="pulsing delay-3" />
            
            <circle cx="0" cy="-20" r="5" fill="url(#secondaryGradient)" class="pulsing delay-2" />
            <circle cx="120" cy="-30" r="5" fill="url(#secondaryGradient)" class="pulsing delay-3" />
            <circle cx="220" cy="-40" r="5" fill="url(#secondaryGradient)" class="pulsing delay-4" />
            <circle cx="300" cy="-30" r="5" fill="url(#secondaryGradient)" class="pulsing delay-5" />
        </g>
        
        <!-- Stats Area -->
        <g transform="translate(480, 200)">
            <!-- Stat Cards -->
            <rect x="0" y="0" width="180" height="50" rx="10" fill="url(#primaryGradient)" opacity="0.9" />
            <text x="15" y="30" font-family="Arial, sans-serif" font-size="16" fill="white">ROI</text>
            <text x="150" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="end">5.4%</text>
            
            <rect x="0" y="60" width="180" height="50" rx="10" fill="url(#secondaryGradient)" opacity="0.9" />
            <text x="15" y="90" font-family="Arial, sans-serif" font-size="16" fill="white">Conversion</text>
            <text x="150" y="90" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="end">8.7%</text>
            
            <rect x="0" y="120" width="180" height="50" rx="10" fill="url(#accentGradient)" opacity="0.9" />
            <text x="15" y="150" font-family="Arial, sans-serif" font-size="16" fill="white">CTR</text>
            <text x="150" y="150" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="end">2.1%</text>
        </g>
    </g>
    
    <!-- Animated Bar Chart -->
    <g transform="translate(200, 420)">
        <g class="growing" transform="translate(0, 0)">
            <rect x="0" y="-40" width="20" height="40" rx="5" fill="url(#primaryGradient)" opacity="0.8" />
        </g>
        <g class="growing delay-1" transform="translate(40, 0)">
            <rect x="0" y="-60" width="20" height="60" rx="5" fill="url(#primaryGradient)" opacity="0.8" />
        </g>
        <g class="growing delay-2" transform="translate(80, 0)">
            <rect x="0" y="-30" width="20" height="30" rx="5" fill="url(#primaryGradient)" opacity="0.8" />
        </g>
        <g class="growing delay-3" transform="translate(120, 0)">
            <rect x="0" y="-70" width="20" height="70" rx="5" fill="url(#primaryGradient)" opacity="0.8" />
        </g>
        <g class="growing delay-4" transform="translate(160, 0)">
            <rect x="0" y="-50" width="20" height="50" rx="5" fill="url(#primaryGradient)" opacity="0.8" />
        </g>
    </g>
    
    <!-- Animated Pie Chart -->
    <g transform="translate(600, 420)">
        <circle cx="0" cy="0" r="40" fill="#f8f9fa" />
        <path d="M0,0 L40,0 A40,40 0 0,1 20,34.64 z" fill="url(#primaryGradient)" class="pulsing" />
        <path d="M0,0 L20,34.64 A40,40 0 0,1 -34.64,20 z" fill="url(#secondaryGradient)" class="pulsing delay-2" />
        <path d="M0,0 L-34.64,20 A40,40 0 0,1 -20,-34.64 z" fill="url(#accentGradient)" class="pulsing delay-4" />
        <path d="M0,0 L-20,-34.64 A40,40 0 0,1 40,0 z" fill="#4cc9f0" class="pulsing delay-3" />
        <circle cx="0" cy="0" r="15" fill="white" />
    </g>
    
    <!-- Floating Elements -->
    <g class="floating delay-2">
        <circle cx="100" cy="50" r="10" fill="url(#primaryGradient)" opacity="0.5" />
    </g>
    <g class="floating delay-3">
        <circle cx="700" cy="100" r="15" fill="url(#secondaryGradient)" opacity="0.5" />
    </g>
    <g class="floating delay-1">
        <circle cx="650" cy="450" r="12" fill="url(#accentGradient)" opacity="0.5" />
    </g>
    <g class="floating delay-4">
        <circle cx="150" cy="450" r="8" fill="url(#primaryGradient)" opacity="0.5" />
    </g>
</svg>